name: 生成 RSS
on:
    schedule:
        - cron: "*/30 * * * *"
    workflow_dispatch:
permissions:
  contents: read

jobs:
    build:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
              with:
                egress-policy: audit

            - name: 签出
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
            - name: 设置 node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
            - name: 配置 git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git reset --hard
                  git pull --rebase
            - name: 安装 npm 依赖
              run: npm install
            - name: 生成 RSS 文件
              env:
                  WEIBO_ID: ${{ vars.WEIBO_ID }}
                  GREASYFORK_ID: ${{ vars.GREASYFORK_ID }}
                  COPYMANGA_TOKEN: ${{ secrets.COPYMANGA_TOKEN }}
              run: node scripts/微博 & node scripts/拷貝漫畫 & node scripts/油猴 & wait
            - name: 更新 RSS 文件
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add -f feeds/* package-lock.json
                  if ! git diff-index --quiet HEAD --; then
                      git commit -m "Update feed"
                      git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gui-ying233/RSS.git
                  else
                      echo "无更新"
                  fi
